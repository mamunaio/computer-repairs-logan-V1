# Pages CMS configuration — https://pagescms.org/docs
#
# Browser-based editing for computerrepairslogan.com.au.
# app.pagescms.org -> computer-repairs-logan -> pick a page -> edit -> Save.
# Saving commits to main, which triggers the Cloudflare Pages build.
#
# Why every page is listed individually instead of as one collection:
# Pages CMS builds a collection listing by fetching the full text of every
# file in the folder in a single request. src/data/pages is 102 files and
# 1.2 MB, which comes back empty (Files cached: 0, status Ok, no error).
# A `file` entry fetches only that one file, so these work. This file is
# generated by scripts/gen-pages-yml.py — rerun it after adding a page.
#
# Editing is raw HTML on purpose. The layout hangs off the class names in
# that markup (hero, wrap, badge, lead, accent). A rich-text editor would
# re-serialise the HTML and strip them, the same failure mode as
# JSON-decoding Elementor data. Change the words between the tags; leave
# the tags and class names alone.

settings:
  cache: true

media:
  input: public/images
  output: /images

components:
  pageBody:
    label: Page content
    description: >-
      The visible page. Edit the text between the tags. Do not change the tags
      or their class names, and do not paste formatted text from Word or a
      website, it brings hidden markup with it.
    type: code
    options:
      format: html
  pageHead:
    label: Search listing and schema
    description: >-
      The <title> and meta description here are what Google shows in search
      results. Keep the title under about 60 characters and the description
      between 120 and 160. The JSON-LD block at the bottom feeds the Google
      business panel, check it at validator.schema.org after changing it.
    type: code
    options:
      format: html

content:
  - name: index
    label: Home
    type: file
    path: src/data/pages/index.json
    format: json
    fields:
      - name: seo
        label: Search listing
        type: object
        fields:
          - name: title
            label: Page title
            description: What Google shows as the blue headline. Aim for under 60 characters.
            type: string
          - name: description
            label: Meta description
            description: The grey text under the headline in search results. 120 to 160 characters.
            type: text

      - name: hero
        label: Top of page
        type: object
        fields:
          - name: badge
            label: Small badge above the heading
            type: string
          - name: headingPlain
            label: Heading, first part
            description: Shown in white.
            type: string
          - name: headingAccent
            label: Heading, highlighted part
            description: Shown in blue.
            type: string
          - name: lead
            label: Opening paragraph
            type: text
          - name: bookLabel
            label: Button text
            type: string
          - name: bookHref
            label: Button link
            type: string
          - name: trust
            label: Tick points
            description: The four short items under the buttons. The tick is added automatically.
            type: string
            list: true
          - name: imageSrc
            label: Hero photo
            type: image
          - name: imageAlt
            label: Photo description
            description: Describes the photo for screen readers and Google Images. Say what is happening in it.
            type: string
          - name: imageWidth
            label: Photo width in pixels
            type: number
          - name: imageHeight
            label: Photo height in pixels
            type: number

      - name: services
        label: What We Fix section
        type: object
        fields:
          - name: eyebrow
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: introBefore
            label: Intro text, before the link
            description: Keep the trailing space.
            type: text
          - name: introLinkLabel
            label: Link text
            type: string
          - name: introLinkHref
            label: Link URL
            type: string
          - name: introAfter
            label: Intro text, after the link
            type: string
          - name: cards
            label: Service cards
            type: object
            list:
              collapsible:
                summary: '{fields.title}'
            fields:
              - name: icon
                label: Emoji
                type: string
              - name: title
                label: Title
                type: string
              - name: description
                label: One-line description
                type: text
              - name: href
                label: Links to
                type: string
          - name: ctaLabel
            label: Button text
            type: string
          - name: ctaHref
            label: Button link
            type: string

      - name: whyUs
        label: Why Locals Call Us section
        type: object
        fields:
          - name: eyebrow
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: points
            label: Points
            type: object
            list:
              collapsible:
                summary: '{fields.lead}'
            fields:
              - name: lead
                label: Bold opening
                type: string
              - name: text
                label: Rest of the sentence
                type: text
          - name: ctaLabel
            label: Button text
            type: string
          - name: ctaHref
            label: Button link
            type: string

      - name: areas
        label: Where We Work section
        description: >-
          The suburb chips themselves come from src/config/business.ts, which
          also feeds the areaServed list in the page's schema so the two cannot
          drift apart. Changing the suburb list is a Claude Code job.
        type: object
        fields:
          - name: eyebrow
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro text
            type: text

      - name: closingCta
        label: Bottom banner
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
          - name: bookLabel
            label: Button text
            type: string
          - name: bookHref
            label: Button link
            type: string
